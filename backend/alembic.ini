# -----------------------------------------------------------------------------
# Alembic Migration Configuration for Single-Instructor LMS
# Architecture Reference: docs/backend/03-BACKEND-FOLDER-STRUCTURE.md
# Runtime Environment: Python 3.14.3, SQLAlchemy 2.0.50, Alembic 1.20.1
# -----------------------------------------------------------------------------

[alembic]
# Path to migration scripts relative to this configuration file (uses %(here)s)
script_location = %(here)s/migrations

# Prepend current directory to sys.path so 'app.*' imports resolve cleanly
prepend_sys_path = .
path_separator = os

# Migration revision file naming convention (e.g. 20261114_0100_a1b2c3d4e5f6_initial_schema.py)
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Delimiter for multiple version locations
version_path_separator = os

# Output encoding
output_encoding = utf-8

# The sqlalchemy.url is intentionally left blank here.
# env.py dynamically loads the database URL from app.core.config.get_settings().DATABASE_URL
# to maintain a single source of truth and protect credentials from disk leakage.
sqlalchemy.url = 

# -----------------------------------------------------------------------------
# Logging Configuration
# -----------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
